site_name: jotty
site_description: An opinionated terminal emulator for Wayland
site_url: https://justanoobcoder.github.io/jotty/
repo_url: https://github.com/justanoobcoder/jotty
repo_name: justanoobcoder/jotty
# hooks.py points the pages it adds at their own source files.
edit_uri: edit/main/site/content/
copyright: MIT licensed

docs_dir: content

# hooks.py adds the pages that live elsewhere in the repository: docs/user/,
# docs/design/, docs/development.md and CHANGELOG.md.
hooks:
  - hooks.py

nav:
  - Home: index.md
  - Features: features.md
  - User guide:
      - user/index.md
      - Installing: user/installation.md
      - Configuration: user/configuration.md
      - Appearance: user/appearance.md
      - Terminal: user/terminal.md
      - Keybinds: user/keybinds.md
      - Mouse and selection: user/mouse.md
      - Links and files: user/links-and-files.md
      - Hints: user/hints.md
      - Search and vi mode: user/search-and-vi-mode.md
      - Shell integration: user/shell-integration.md
      - Notifications: user/notifications.md
      - Single instance: user/single-instance.md
      - Known issues: user/known-issues.md
  - Changelog: changelog.md
  - Design notes:
      - design/README.md
      - Architecture overview: design/overview.md
      - Terminal and PTY: design/terminal.md
      - Input: design/input.md
      - Rendering: design/rendering.md
      - Windows: design/windows.md
      - Clipboard: design/clipboard.md
      - Config and overrides: design/config.md
      - Escape sequences: design/escape-sequences.md
      - Links, files and hints: design/links-and-hints.md
      - Development: development.md

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
