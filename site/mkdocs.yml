site_name: jotty
site_description: An opinionated terminal emulator for Wayland
site_url: https://justanoobcoder.github.io/jotty/
repo_url: https://github.com/justanoobcoder/jotty
repo_name: justanoobcoder/jotty
# hooks.py points the pages it adds at their own source files.
edit_uri: edit/main/site/content/
copyright: MIT licensed

docs_dir: content

# hooks.py adds the pages that live elsewhere in the repository (docs/,
# CHANGELOG.md, README sections) and generates the config reference.
hooks:
  - hooks.py

nav:
  - Home: index.md
  - Features: features.md
  - Install: install.md
  - Usage: usage.md
  - Configuration:
      - Guide: configuration.md
      - Reference: config-reference.md
  - Known issues: known-issues.md
  - Changelog: changelog.md
  - Development:
      - Architecture: architecture.md
      - Development: development.md

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/config-ref.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
