# jotty configuration, showing every option with its default value.
#
# Copy to ~/.config/jotty/config.toml (or $XDG_CONFIG_HOME/jotty/config.toml)
# and keep only the lines you change. Unknown keys are rejected.

[font]
# Family name as known to fontconfig (`fc-list : family`), or a generic
# name such as "monospace".
family = "monospace"
# Size in points at 96 DPI; multiplied by the output's scale factor.
size = 11.0
# Points font_larger and font_smaller add or remove, per key press or
# wheel notch.
size_step = 1.0
# Families tried, in order, for characters the main font lacks. After these,
# fontconfig picks a font like the main one that has the character, then
# any installed font that has it.
fallback = []

[window]
title = "jotty"
# Application ID, used by compositors for window rules.
app_id = "jotty"
# Space around the text, in logical pixels.
padding = 4
# Background opacity from 0.0 to 1.0. Text, the cursor and the selection
# stay opaque.
opacity = 1.0
# Also make cells with an explicit background color (as painted by vim or
# tmux themes) transparent. When false, only the default background is.
transparent_cell_backgrounds = false
# Blur what is behind the window, on compositors that support
# ext-background-effect-v1. Only visible with opacity below 1.0.
blur = false
# "cpu" draws in software, repainting only what changed, and uses far less
# memory, since no GPU driver is loaded. "gpu" draws with OpenGL ES, which
# is cheaper for constant full-screen redraws of a large window. jotty falls
# back to "cpu" when OpenGL isn't available.
renderer = "cpu"
# When the bell rings (BEL) while the window isn't focused, ask the
# compositor to mark it urgent.
bell_urgent = true
# Show the desktop notifications programs ask for (OSC 9, OSC 777) while
# the window isn't focused. Clicking one focuses the window.
notifications = true
# Open each new window in the jotty already running for this Wayland display
# and config file instead of starting another process, as --single-instance
# does. Takes effect when jotty starts.
single_instance = false
# Initial size in cells (the compositor may override it).
columns = 80
lines = 24

[terminal]
# Program to run. When unset: $SHELL, then /bin/sh.
# shell = "/run/current-system/sw/bin/fish"
# Value of $TERM in the child. "auto" uses jotty's terminfo entry ("jotty")
# when it is installed and "xterm-256color" otherwise.
term = "auto"
# Lines of scrollback history.
scrollback = 10000
# Draw bold text in the first eight colors with their bright variants.
bold_is_bright = true

[colors]
foreground = "#dcdcdc"
background = "#181818"
# Cursor color; defaults to the foreground color when unset.
# cursor = "#dcdcdc"
# Color of the character under a block cursor; defaults to the background
# color of that cell.
# cursor_text = "#181818"
# Selection colors; each defaults to inverse video (the cell's own colors
# swapped) when unset.
# selection_foreground = "#181818"
# selection_background = "#dcdcdc"
# The 16 ANSI colors: black, red, green, yellow, blue, magenta, cyan, white,
# then their bright variants. A shorter list overrides only the first entries.
palette = [
    "#242424", "#e06c75", "#98c379", "#e5c07b",
    "#61afef", "#c678dd", "#56b6c2", "#c8c8c8",
    "#5c6370", "#ff7a85", "#b5e890", "#ffd68a",
    "#7ec7ff", "#de93f2", "#6ed3df", "#ffffff",
]

[keybinds]
# Actions and their key combos. Listing an action replaces its defaults;
# an empty list unbinds it. Combos are modifiers (ctrl, alt, shift, super)
# and an xkb key name, a character, or a wheel direction (wheel_up,
# wheel_down, wheel_left, wheel_right), joined by "+".
copy = ["ctrl+shift+c"]
# Copy when text is selected, otherwise pass the key on; with "ctrl+c",
# Ctrl+C copies a selection and interrupts the program otherwise.
copy_or_interrupt = []
paste = ["ctrl+shift+v", "shift+insert"]
scroll_line_up = []
scroll_line_down = []
scroll_page_up = ["shift+page_up"]
scroll_page_down = ["shift+page_down"]
scroll_to_top = ["shift+home"]
scroll_to_bottom = ["shift+end"]
font_larger = ["ctrl+plus", "ctrl+equal", "ctrl+kp_add", "ctrl+wheel_up"]
font_smaller = ["ctrl+minus", "ctrl+kp_subtract", "ctrl+wheel_down"]
font_reset = ["ctrl+0", "ctrl+kp_0"]
# Search the scrollback: type to search older output, Up/Ctrl+R and
# Down/Ctrl+S for the previous and next match, Enter to keep the match
# selected, Escape to cancel.
search = ["ctrl+shift+f"]
# Open another jotty in the current directory of the shell (or whatever
# runs in the terminal), with the same config file.
new_window = ["ctrl+shift+n"]
# Vi mode: move a cursor over the screen and scrollback with vim keys,
# select (v, V, Ctrl+V), yank (y), search (/, ?, n, N); Escape leaves.
vi_mode = ["ctrl+shift+space"]
# Read the config file again (it also reloads by itself when saved, and on
# SIGUSR1).
reload_config = ["ctrl+shift+r"]

[url]
# Ctrl+click opens the link under the pointer: a hyperlink a program set
# (OSC 8), a URL in the text, or the path of a file (see [files] below).
# Holding Ctrl underlines it first.
# The command that opens URLs; the link is added as the last argument.
launcher = ["xdg-open"]
# Regular expressions (Rust regex syntax) for more kinds of links, matched
# against the line under the pointer. The matched text goes to the launcher
# above, which also opens files whose kind has no launcher of its own.
# regex = ['\bJIRA-\d+\b']
regex = []

# Kinds of files whose paths are links: Ctrl+click opens an existing file
# with one of the kind's extensions (relative paths are resolved in the
# current directory of the program in the terminal). Each kind has its own
# launcher; empty means url.launcher. Add kinds with [files.<name>]; a kind
# here only changes the fields it sets, and extensions = [] turns it off.
[files.audio]
extensions = [
    "mp3", "flac", "ogg", "oga", "opus", "wav", "m4a", "aac", "wma", "aiff", "aif",
    "ape", "alac", "mka",
]
launcher = []      # e.g. ["mpv"]

[files.document]
extensions = [
    "pdf", "epub", "djvu", "doc", "docx", "odt", "rtf", "xls", "xlsx", "ods", "ppt",
    "pptx", "odp",
]
launcher = []      # e.g. ["zathura"]

[files.image]
extensions = [
    "png", "jpg", "jpeg", "gif", "webp", "avif", "jxl", "heic", "heif", "bmp", "tif",
    "tiff", "svg", "ico",
]
launcher = []      # e.g. ["imv"] or ["swayimg"]

[files.video]
extensions = [
    "mp4", "mkv", "webm", "mov", "avi", "m4v", "wmv", "flv", "mpg", "mpeg", "ogv",
    "3gp",
]
launcher = []      # e.g. ["mpv"]
