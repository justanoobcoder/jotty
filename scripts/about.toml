# cargo-about configuration for THIRD-PARTY-LICENSES; run
# scripts/third-party-licenses.sh.

# In order of preference, for crates offering a choice.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Lists third-party crates only: jotty is publish = false
private = { ignore = true }

# miniz_oxide ships two MIT files that differ by a blank line, with equal
# confidence, so cargo-about would take whichever the filesystem lists first
[miniz_oxide.clarify]
license = "MIT OR Zlib OR Apache-2.0"

[[miniz_oxide.clarify.files]]
path = "LICENSE-MIT.md"
license = "MIT"
checksum = "799e9ca9d179295ef372f25d3769cdda7d25bb2668add6a6a1e22d1e4c678b8d"

[[miniz_oxide.clarify.files]]
path = "LICENSE-ZLIB.md"
license = "Zlib"
checksum = "0a54e647fe54104658b5e563c04c6f9edf251710e47bce692e0bd990a4ddaa39"

[[miniz_oxide.clarify.files]]
path = "LICENSE-APACHE.md"
license = "Apache-2.0"
checksum = "0d542e0c8804e39aa7f37eb00da5a762149dc682d7829451287e11b938e94594"
