name: Release

# Pushing a tag such as `v0.2.0` builds jotty for the major distributions
# and publishes a GitHub release with the packages attached, described by
# the `## 0.2.0` entries of CHANGELOG.md. Tags with a `-` (`v0.2.0-rc.1`)
# are published as pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: The tag must match Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "$cargo" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $cargo in Cargo.toml"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - id: notes
        name: CHANGELOG.md must have an entry for the version
        run: |
          # The lines under `## VERSION`, up to the next heading, without
          # the blank lines around them.
          notes=$(awk -v v="## ${{ steps.version.outputs.version }}" '
            $0 == v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' -e ':a' -e '/^\n*$/{$d;N;ba' -e '}')
          if [ -z "$notes" ]; then
            echo "::error::CHANGELOG.md has no entries under ## ${{ steps.version.outputs.version }}"
            exit 1
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  linux:
    name: Packages (${{ matrix.arch }})
    needs: version
    strategy:
      matrix:
        include:
          # Ubuntu 22.04 for its older glibc (2.35): the binaries then run
          # on Debian 12, Ubuntu 22.04 and every newer distribution.
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libegl-dev \
            libfontconfig-dev ncurses-bin
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - run: cargo build --release --locked
      - name: Compile the terminfo entry
        run: |
          tic -x -o target/terminfo extra/jotty.terminfo
          # unibilium (Neovim) refuses entries of 4096 bytes or more.
          size=$(stat -c %s target/terminfo/j/jotty)
          if [ "$size" -ge 4096 ]; then
            echo "::error::terminfo entry is $size bytes, must stay under 4096"
            exit 1
          fi
      - run: strip target/release/jotty
      - name: Tarball
        run: |
          name="jotty-$VERSION-${{ matrix.arch }}-linux"
          mkdir -p "dist/$name/bin" "dist/$name/share/doc/jotty"
          install -m755 target/release/jotty "dist/$name/bin/"
          # jotty finds the entry next to its binary (../share/terminfo).
          install -Dm644 target/terminfo/j/jotty "dist/$name/share/terminfo/j/jotty"
          install -Dm644 extra/jotty.desktop "dist/$name/share/applications/jotty.desktop"
          install -Dm644 extra/jotty.svg "dist/$name/share/icons/hicolor/scalable/apps/jotty.svg"
          install -m644 README.md LICENSE THIRD-PARTY-LICENSES docs/*.md docs/config.example.toml "dist/$name/share/doc/jotty/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -r "dist/$name"
      - name: Debian package
        run: |
          cargo deb --no-build --locked
          cp target/debian/*.deb dist/
      - name: RPM package
        run: |
          cargo generate-rpm
          cp target/generate-rpm/*.rpm dist/
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  arch:
    name: Arch Linux package
    needs: version
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Install build tools and libraries
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust wayland libxkbcommon \
            libglvnd fontconfig ncurses
      - uses: actions/checkout@v7
      - name: Build with makepkg
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd packaging/arch
          # The tagged source, where makepkg looks for it before downloading.
          git -C "$GITHUB_WORKSPACE" archive --prefix="jotty-$VERSION/" \
            -o "$PWD/jotty-$VERSION.tar.gz" HEAD
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
          # makepkg refuses to run as root.
          useradd --create-home builder
          chown -R builder .
          su builder -c "makepkg --noconfirm"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp ./*.pkg.tar.zst "$GITHUB_WORKSPACE/dist/"
      - uses: actions/upload-artifact@v7
        with:
          name: arch-x86_64
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [version, linux, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: ${{ needs.version.outputs.notes }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

  aur:
    name: Publish to the AUR
    needs: [version, linux, release]
    # A pkgver cannot contain a `-`, and pre-releases stay off the AUR.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed base-devel git openssh
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - name: Set up SSH for the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          install -m600 /dev/null "$RUNNER_TEMP/aur_key"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/aur_key"
          # The AUR's ed25519 host key, SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4.
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' \
            > "$RUNNER_TEMP/aur_known_hosts"
      - name: Push jotty-git and jotty-bin
        # bash -eo pipefail, so a missing tarball fails the step.
        shell: bash
        run: |
          # ssh in a container ignores $HOME, so pass the key and host explicitly.
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/aur_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/aur_known_hosts"
          git config --global --add safe.directory '*'
          git config --global user.name 'Nguyen Hong Hiep'
          git config --global user.email 'syaorancode@gmail.com'
          # makepkg refuses to run as root.
          useradd --create-home builder

          # What pkgver() gives for the tagged commit.
          git_pkgver="$VERSION.r0.g$(git rev-parse --short=7 HEAD)"
          sum_x86_64=$(sha256sum "dist/jotty-$VERSION-x86_64-linux.tar.gz" | cut -d' ' -f1)
          sum_aarch64=$(sha256sum "dist/jotty-$VERSION-aarch64-linux.tar.gz" | cut -d' ' -f1)

          publish() {
            pkg=$1 pkgver=$2
            git clone "ssh://aur@aur.archlinux.org/$pkg.git" "aur/$pkg"
            cp "packaging/aur/$pkg/PKGBUILD" "aur/$pkg/"
            cd "aur/$pkg"
            sed -i -e "s/^pkgver=.*/pkgver=$pkgver/" -e 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
            if [ "$pkg" = jotty-bin ]; then
              sed -i -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('$sum_x86_64')/" \
                -e "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('$sum_aarch64')/" PKGBUILD
            fi
            chown -R builder .
            su builder -c 'makepkg --printsrcinfo > .SRCINFO'
            git add PKGBUILD .SRCINFO
            if git diff --cached --quiet; then
              echo "$pkg is already up to date"
            else
              git commit -m "Update to $pkgver"
              git push origin HEAD:master
            fi
            cd "$GITHUB_WORKSPACE"
          }

          publish jotty-git "$git_pkgver"
          publish jotty-bin "$VERSION"
