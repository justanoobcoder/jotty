name: CI

# Markdown, packaging and helper scripts never reach the build or the tests
# (the package's src in flake.nix leaves them out), so changes to them alone
# skip CI. docs/config.example.toml is not ignored: a test parses it.
on:
  push:
    branches: [main, cachix]
    paths-ignore: &ignored
      - "**.md"
      - LICENSE
      - .gitignore
      - packaging/**
      - scripts/**
      - .github/workflows/release.yml
  pull_request:
    paths-ignore: *ignored
  workflow_dispatch:

# A newer push to the same branch or pull request cancels older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - uses: cachix/install-nix-action@v31
      - name: nixfmt
        run: nix fmt -- --check flake.nix

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libegl-dev libfontconfig-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native libraries and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libegl-dev libfontconfig-dev \
            fonts-dejavu-core fonts-noto-color-emoji
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: cargo test --locked

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libegl-dev libfontconfig-dev
      # Keep in sync with `rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked

  nix:
    name: Nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Pulls from the cache; only pushes to the cachix branch upload what
      # this job built (Cachix leaves out what cache.nixos.org already has),
      # so main and pull requests can't fill the cache.
      - uses: cachix/cachix-action@v17
        with:
          name: justanoobcoder
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.ref != 'refs/heads/cachix' }}
      # Builds the package (running the tests), clippy and rustfmt in the
      # sandbox, and checks that the terminfo entry stays small enough.
      - run: nix flake check --print-build-logs
