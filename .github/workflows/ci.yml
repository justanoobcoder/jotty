name: CI

# Markdown, packaging and helper scripts never reach the build or the tests
# (the package's src in flake.nix leaves them out), so changes to them alone
# skip CI. docs/config.example.toml is not ignored: a test parses it. The
# home-manager module is outside the src too, but users follow the cachix
# branch, which only `publish` moves, so a module change must run.
on:
  push:
    branches: [main]
    paths-ignore: &ignored
      - "**.md"
      - LICENSE
      - .gitignore
      - packaging/**
      - scripts/**
      - .github/workflows/release.yml
  pull_request:
    paths-ignore: *ignored
  workflow_dispatch:

# A newer push to the same branch or pull request cancels older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - uses: cachix/install-nix-action@v31
      - name: nixfmt
        run: nix fmt -- --check flake.nix

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libegl-dev libfontconfig-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native libraries and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libegl-dev libfontconfig-dev \
            fonts-dejavu-core fonts-noto-color-emoji
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: cargo test --locked

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libegl-dev libfontconfig-dev
      # Keep in sync with `rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked

  nix:
    name: Nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Pulls from the cache; builds of main upload what this job built
      # (Cachix leaves out what cache.nixos.org already has). Pull requests
      # only pull. A full cache drops its least recently used paths.
      - uses: cachix/cachix-action@v17
        with:
          name: justanoobcoder
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
      # Builds the package (running the tests), clippy and rustfmt in the
      # sandbox, and checks that the terminfo entry stays small enough.
      - run: nix flake check --print-build-logs

  # Users follow the cachix branch, so it only ever points at a commit that
  # passed every job and whose build is already in the cache: installs never
  # miss it mid-build.
  publish:
    name: Move the cachix branch
    needs: [fmt, clippy, test, msrv, nix]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Skips a commit main has dropped (a force push) or that cachix is
      # already at or past (a rerun of an older build).
      - run: |
          git fetch origin   # main may have moved while the build ran
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || exit 0
          if git rev-parse -q --verify origin/cachix >/dev/null; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/cachix && exit 0
          fi
          git push --force origin "$GITHUB_SHA:refs/heads/cachix"
