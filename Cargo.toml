[package]
name = "jotty"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A minimal, Wayland-native, GPU-accelerated terminal emulator"
license = "MIT"
authors = ["Nguyễn Hồng Hiệp"]

[dependencies]
ab_glyph = { version = "0.2.32", features = ["variable-fonts"] }
env_logger = "0.11.11"
glow = "0.18.0"
khronos-egl = { version = "6.0.0", features = ["static"] }
libc = "0.2.191"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
smithay-client-toolkit = "0.21.1"
toml = "1.1.8"
unicode-width = "0.2.2"
vte = "0.15.0"
wayland-client = "0.31.15"
wayland-egl = "0.32.11"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable", "staging"] }
xkbcommon = { version = "0.8", default-features = false }
yeslogic-fontconfig-sys = "6.0.1"

[profile.release]
lto = "thin"
codegen-units = 1
