[package]
name = "jotty"
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
description = "An opinionated, Wayland-native terminal emulator"
license = "MIT"
authors = ["Nguyen Hong Hiep"]

[dependencies]
ab_glyph = { version = "0.2.32", features = ["variable-fonts"] }
env_logger = "0.11.11"
glow = "0.18.0"
khronos-egl = { version = "6.0.0", features = ["static"] }
libc = "0.2.191"
log = "0.4.34"
memchr = "2.8.3"
miniz_oxide = "0.9.1"
png = "0.18"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
smithay-client-toolkit = "0.21.1"
toml = "1.1.8"
ttf-parser = "0.25"
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
# Fork with `Perform::print_ascii`; see docs/architecture.md.
vte = { git = "https://github.com/justanoobcoder/vte", rev = "ef778131e9761aaffecc296d387ce3a3b879d4de", default-features = false }
wayland-client = "0.31.15"
wayland-egl = "0.32.11"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable", "staging"] }
xkbcommon = { version = "0.9.0", default-features = false }
yeslogic-fontconfig-sys = "6.0.1"

[profile.release]
lto = "thin"
codegen-units = 1

# Distribution packages, built by the release workflow. The terminfo entry is
# compiled there first, with `tic -x -o target/terminfo extra/jotty.terminfo`.

[package.metadata.deb]
section = "x11"
priority = "optional"
depends = "$auto"
extended-description = """\
An opinionated terminal emulator for Wayland: GPU or CPU rendering, input methods \
with surrounding text, grapheme clusters and color emoji, reflow, scrollback \
search, clickable links and a vi mode."""
assets = [
    ["target/release/jotty", "usr/bin/", "755"],
    ["target/terminfo/j/jotty", "usr/share/terminfo/j/", "644"],
    ["extra/jotty.desktop", "usr/share/applications/", "644"],
    ["extra/jotty.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/jotty/", "644"],
    ["docs/*.md", "usr/share/doc/jotty/", "644"],
    ["docs/config.example.toml", "usr/share/doc/jotty/", "644"],
]

[package.metadata.generate-rpm]
auto-req = "auto"
assets = [
    { source = "target/release/jotty", dest = "/usr/bin/jotty", mode = "755" },
    { source = "target/terminfo/j/jotty", dest = "/usr/share/terminfo/j/jotty", mode = "644" },
    { source = "extra/jotty.desktop", dest = "/usr/share/applications/jotty.desktop", mode = "644" },
    { source = "extra/jotty.svg", dest = "/usr/share/icons/hicolor/scalable/apps/jotty.svg", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/jotty/LICENSE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/jotty/README.md", mode = "644", doc = true },
    { source = "docs/*.md", dest = "/usr/share/doc/jotty/", mode = "644", doc = true },
    { source = "docs/config.example.toml", dest = "/usr/share/doc/jotty/config.example.toml", mode = "644", doc = true },
]
